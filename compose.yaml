services:
  spring-app:
    profiles: ["basic"]
    image: spring-demo:v1
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 256m
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - spring-network

  postgres:
    profiles: ["basic"]
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - spring-network

  redis:
    profiles: ["basic"]
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - spring-network

  nginx:
    profiles: ["basic"]
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      spring-app:
        condition: service_healthy
      angular:
        condition: service_started
    networks:
      - spring-network

  angular:
    profiles: ["basic"]
    image: angular-frontend:v1
    restart: unless-stopped
    networks:
      - spring-network

  debug-tools:
    profiles: ["dev"]
    image: alpine:3.22
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - spring-network

networks:
  spring-network:
    external: true

volumes:
  postgres-data: